name: 🚩 Build Flag Emoji Subset & Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version (e.g., v1.0.0)"
                required: true
                default: "v1.0.0"
            twemoji_version:
                description: "Twemoji source version (optional)"
                required: false
                default: "17.0.2"

env:
    FONT_NAME: TwemojiCountryFlags
    UNICODE_RANGE: U+1F1E6-1F1FF

jobs:
    build:
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: 🔧 Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    fontforge \
                    python3-fontforge \
                    fonttools \
                    brotli \
                    woff2 \
                    perl \
                    make \
                    python3-pip

                  pip3 install --upgrade "fonttools[brotli]>=4.40.0"

            - name: 🔍 Verify Python environment
              run: |
                  echo "=== Python Info ==="
                  which python3
                  python3 --version
                  python3 -c "import sys; print('Python path:', sys.executable)"
                  echo "=== Fontforge Module ==="
                  python3 -c "import fontforge; print('Fontforge version:', fontforge.version())"
                  fontforge --version

            - name: 📦 Install npm dependencies
              run: |
                  if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
                    npm ci
                  else
                    echo "⚠️ 未检测到锁文件，使用 npm install"
                    npm install
                  fi

            - name: 🔨 Build full TTF font
              run: |
                  mkdir -p build build/raw-font dist
                  echo "🔧 开始串行构建字体..."
                  make
                  echo "📊 构建结果:"
                  ls -lh build/
                  # 验证字体文件生成
                  if [ -f "build/Twemoji Mozilla.ttf" ]; then
                    echo "✅ 字体文件生成成功"
                    file "build/Twemoji Mozilla.ttf"
                  else
                    echo "❌ 字体文件生成失败"
                    exit 1
                  fi

            - name: ✂️ Extract flag emoji subset + convert to WOFF2
              run: |
                    mkdir -p dist
                    cat > subset_colr.py << 'PYEOF'
                    import fontforge
                    import sys
                    print("打开字体文件...")
                    font = fontforge.open("build/Twemoji Mozilla.ttf")
                    flag_start = 0x1F1E6
                    flag_end = 0x1F200
                    glyphs_to_keep = set()
                    for glyph in font:
                        try:
                            code = ord(glyph)
                            if flag_start <= code <= flag_end:
                                glyphs_to_keep.add(glyph)
                                print(f"保留：{glyph} (U+{code:04X})")
                        except (TypeError, ValueError):
                                continue
                    print(f"\n共找到 {len(glyphs_to_keep)} 个国旗字形")
                    for glyph in font:
                        if glyph not in glyphs_to_keep: 
                            font.selection[glyph] = False
                        else:
                            font.selection[glyph] = True
                    font.generate("dist/TwemojiCountryFlags.ttf", flags=("opentype"))
                    font.close()
                    print("✅ FontForge 子集化完成")
                    PYEOF
                    fontforge -script subset_colr.py
                    echo "转换为 WOFF2 格式..."
                    woff2_compress "dist/TwemojiCountryFlags.ttf"
                    mv "dist/TwemojiCountryFlags.ttf.woff2" "dist/TwemojiCountryFlags.woff2"
                    echo "📊 构建结果:"
                    ls -lh dist/

                    echo "🔍 字体验证:"
                    python3 << 'PYYEOF'
                    from fontTools.ttLib import TTFont
                    try:
                        font = TTFont('dist/TwemojiCountryFlags.woff2')
                        glyph_count = len(font.getGlyphOrder())
                        print(f'✅ 字体有效，包含 {glyph_count} 个字形')
                        font.close()
                        if glyph_count < 50 or glyph_count > 500:
                            print('⚠️ 字形数量异常，请检查子集化结果')
                        except Exception as e:
                            print('❌ 字体验证失败:', e)
                            exit(1)
                    PYYEOF

            - name: 🚀 Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.inputs.version }}
                  name: "🚩 ${{ env.FONT_NAME }} ${{ github.event.inputs.version }}"
                  body: |
                      ## 📦 字体信息
                      - 源项目：[win98se/twemoji-colr](https://github.com/win98se/twemoji-colr)
                      - Twemoji 版本：${{ github.event.inputs.twemoji_version }}
                      - Unicode 范围：${{ env.UNICODE_RANGE }} (Flag Emoji)
                      - 格式：WOFF2 (压缩) + TTF (完整备份)

                      ## 🔗 CDN 使用示例
                      ```css
                      @font-face {
                        font-family: 'Windows11FlagFix';
                        src: url('https://cdn.jsdelivr.net/gh/${{ github.repository_owner }}/twemoji-colr@${{ github.event.inputs.version }}/dist/${{ env.FONT_NAME }}.woff2') format('woff2');
                        unicode-range: U+1F1E6-1F1FF;
                      }
                      ```
                  files: |
                      dist/${{ env.FONT_NAME }}.woff2
                      dist/${{ env.FONT_NAME }}.ttf
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
