name: 🚩 Build Flag Emoji Subset & Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version (e.g., v1.0.0)"
                required: true
                default: "v1.0.0"
            twemoji_version:
                description: "Twemoji source version (optional)"
                required: false
                default: "17.0.2"

env:
    FONT_NAME: TwemojiCountryFlags
    UNICODE_RANGE: U+1F1E6-1F1FF

jobs:
    build:
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: 🔧 Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    fontforge \
                    python3-fontforge \
                    fonttools \
                    brotli \
                    woff2 \
                    perl \
                    make \
                    python3-pip

                  pip3 install --upgrade "fonttools[brotli]>=4.40.0"

            - name: 🔍 Verify Python environment
              run: |
                  echo "=== Python Info ==="
                  which python3
                  python3 --version
                  python3 -c "import sys; print('Python path:', sys.executable)"
                  echo "=== Fontforge Module ==="
                  python3 -c "import fontforge; print('Fontforge version:', fontforge.version())"
                  fontforge --version

            - name: 📦 Install npm dependencies
              run: |
                  if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
                    npm ci
                  else
                    echo "⚠️ 未检测到锁文件，使用 npm install"
                    npm install
                  fi

            - name: 🔨 Build full TTF font
              run: |
                  mkdir -p build build/raw-font dist
                  echo "🔧 开始串行构建字体..."
                  make
                  echo "📊 构建结果:"
                  ls -lh build/
                  # 验证字体文件生成
                  if [ -f "build/Twemoji Mozilla.ttf" ]; then
                    echo "✅ 字体文件生成成功"
                    file "build/Twemoji Mozilla.ttf"
                  else
                    echo "❌ 字体文件生成失败"
                    exit 1
                  fi

            - name: ✂️ Extract flag emoji subset + convert to WOFF2
              run: |
                  set -euo pipefail
                  mkdir -p dist

                  echo "🧩 生成区域指示符两两组合文本，用于触发旗帜 GSUB/ligature 闭包..."
                  python3 << 'PYEOF'
                  chars = [chr(cp) for cp in range(0x1F1E6, 0x1F200)]
                  with open("flags.txt", "w", encoding="utf-8") as f:
                      for a in chars:
                          for b in chars:
                              f.write(a + b + "\n")
                  print("✅ flags.txt 已生成")
                  PYEOF

                  echo "✂️ 使用 pyftsubset 直接对子集化并输出 WOFF2..."
                  pyftsubset "build/Twemoji Mozilla.ttf" \
                    --text-file=flags.txt \
                    --output-file="dist/${{ env.FONT_NAME }}.woff2" \
                    --flavor=woff2 \
                    --layout-features='*' \
                    --glyph-names \
                    --symbol-cmap \
                    --legacy-cmap \
                    --notdef-glyph \
                    --notdef-outline \
                    --recommended-glyphs \
                    --name-IDs='*' \
                    --name-legacy \
                    --retain-gids \
                    --verbose

                  cp "build/Twemoji Mozilla.ttf" "dist/${{ env.FONT_NAME }}.ttf"

                  echo "📊 构建结果:"
                  ls -lh dist/

                  echo "🔍 字体验证:"
                  python3 << 'PYYEOF'
                  from fontTools.ttLib import TTFont

                  path = "dist/${{ env.FONT_NAME }}.woff2"
                  font = TTFont(path)
                  glyph_count = len(font.getGlyphOrder())
                  print(f"✅ 字体有效，包含 {glyph_count} 个字形")

                  print("✅ 包含的表：", ", ".join(font.keys()))
                  if "COLR" not in font:
                      raise SystemExit("❌ 缺少 COLR 表")
                  if "CPAL" not in font:
                      raise SystemExit("❌ 缺少 CPAL 表")

                  font.close()
                  PYYEOF

            - name: 🚀 Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.inputs.version }}
                  name: "🚩 ${{ env.FONT_NAME }} ${{ github.event.inputs.version }}"
                  body: |
                      ## 📦 字体信息
                      - 源项目：[win98se/twemoji-colr](https://github.com/win98se/twemoji-colr)
                      - Twemoji 版本：${{ github.event.inputs.twemoji_version }}
                      - Unicode 范围：${{ env.UNICODE_RANGE }} (Flag Emoji)
                      - 格式：WOFF2 (压缩) + TTF (完整备份)

                      ## 🔗 CDN 使用示例
                      ```css
                      @font-face {
                        font-family: 'Windows11FlagFix';
                        src: url('https://cdn.jsdelivr.net/gh/${{ github.repository_owner }}/twemoji-colr@${{ github.event.inputs.version }}/dist/${{ env.FONT_NAME }}.woff2') format('woff2');
                        unicode-range: U+1F1E6-1F1FF;
                      }
                      ```
                  files: |
                      dist/${{ env.FONT_NAME }}.woff2
                      dist/${{ env.FONT_NAME }}.ttf
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
